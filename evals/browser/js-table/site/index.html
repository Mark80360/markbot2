<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>商品价格</title></head><body>
<h1>商品价格</h1><table id="t" border="1"><thead><tr><th>商品</th><th>价格（元）</th></tr></thead><tbody></tbody></table>
<script>
const rows=[["Alpha","38.00"],["Beta","25.90"],["Gamma","12.50"],["Delta","19.99"]];
setTimeout(()=>{const b=document.querySelector("#t tbody");
for(const [n,p] of rows){const tr=document.createElement("tr");tr.innerHTML=`<td>${n}</td><td>${p}</td>`;b.appendChild(tr);}},300);
</script></body></html>
