[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markbot"
version = "0.1.0"
description = "MarkBot2: 1+N personal assistant agent with permissioned extensions and a self-improving learning layer"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "MarkBot" }]
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
office = ["openpyxl>=3.1,<4"]
channels = ["lark-oapi>=1.8,<2"]
cron = ["croniter>=2,<7"]
mcp = ["mcp>=1.0,<2"]
browser = ["playwright>=1.45,<2"]
pdf = ["pypdf>=4,<6"]
desktop = [
    "mss>=9",
    "pillow>=10",
    "pyautogui>=0.9.54",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]
sysops = ["psutil>=5.9"]
dev = ["pytest>=8", "ruff>=0.5", "pyright>=1.1.380"]

[project.scripts]
markbot = "markbot.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["markbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
extend-exclude = ["capabilities", "evals"]

[tool.ruff.lint]
# 阻断门禁（AGENTS.md）。更严格的规则见 scripts/lint_strict.sh：先以「棘轮」方式
# 跑出存量问题并逐步清零，清零的规则再挪进这里，避免一次性把门禁打红。
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# 渠道入口在补齐 sys.path 之后才能导入同级模块
"channels/feishu/channel.py" = ["E402"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingModuleSource = "none"
